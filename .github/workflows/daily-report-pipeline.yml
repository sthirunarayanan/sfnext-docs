name: Daily Report Pipeline

# Weekday pipeline for the password-gated "Daily Report" tab:
#   1. GENERATE (self-hosted runner on the principal's machine): calls the Chief agent
#      directly - agents, consolidation, save, and publish to the repo - so the day's
#      briefing exists even when the machine slept through the 06:45 IST local task.
#      Jobs for an offline self-hosted runner queue and run at next wake: no more
#      skipped mornings.
#   2. VERIFY (cloud): checks the day's report landed in the repo
#      (src/data/daily-reports/<YYYY-MM-DD>.md) - a missing report fails with a red X.
#   3. PUBLISH (cloud): rebuilds and redeploys the site so the report is guaranteed live.
#
# Runs every working day (Mon-Fri) at 08:00 IST sharp: cron is UTC and IST is UTC+5:30
# with no DST, so '30 2 * * 1-5' is exactly 08:00 IST all year round. The local Chief
# agent runs earlier (scheduled task at 02:15 machine time / 06:45 IST) so the day's
# report is already published when this pipeline verifies it. Note GitHub can start
# scheduled runs a few minutes late.

on:
  schedule:
    - cron: '30 2 * * 1-5'
  workflow_dispatch:
    inputs:
      report_date:
        description: 'Report date to verify (YYYY-MM-DD). Empty = today (UTC).'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  generate-briefing:
    # Runs on the principal's machine (self-hosted runner 'chief-host') and calls the Chief
    # agent directly, so the day's briefing is generated and published even when the laptop
    # was asleep at the scheduled start: jobs targeting an offline self-hosted runner QUEUE
    # on GitHub and execute the moment the machine wakes. Safety: this repo is public, so
    # NO pull_request/push trigger may ever target this runner - only the schedule and
    # manual dispatch below, which always execute code from main (owner-pushable only).
    runs-on: chief-host
    timeout-minutes: 45
    steps:
      - name: Run the Chief daily cycle (agents, save, publish)
        shell: pwsh
        run: |
          $script = 'C:\Users\SThirunarayanan\.config\opencode\scripts\chief-daily.ps1'
          if (-not (Test-Path $script)) { Write-Error "chief-daily.ps1 not found at $script"; exit 1 }
          & $script

  verify-and-publish:
    needs: generate-briefing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify the day's report landed
        shell: pwsh
        env:
          PIPELINE_DATE: ${{ github.event.inputs.report_date }}
        run: ./scripts/feed-daily-report.ps1 -Verify -Date $env:PIPELINE_DATE

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          # Required repository secrets - see README.md "Production build".
          # Vite bakes env vars in at build time, so these must be set here,
          # not only in a runtime .env file.
          VITE_DOCS_PASSWORD_HASH: ${{ secrets.VITE_DOCS_PASSWORD_HASH }}
          VITE_UNIFI_DEMO_PASSWORD_HASH: ${{ secrets.VITE_UNIFI_DEMO_PASSWORD_HASH }}
          VITE_REPORT_PASSWORD_HASH: ${{ secrets.VITE_REPORT_PASSWORD_HASH }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: verify-and-publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
